<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact & Feedback | Prayer Embassy Ministries Kisigula</title>
<meta name="description" content="Prayer Embassy Ministries, Mutundwe-Kisigula, Kampala, Uganda.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="wrap"><p>We Would Love to Hear from You</p><h1>Contact & Feedback</h1></div></div>
<section><div class="wrap"><div class="info" data-render="contact"></div></div></section><section id="feedback" class="alt-bg">
  <div class="wrap">
    <p>We Would Love to Hear from You</p>
    <h2>Feedback &amp; Consultation</h2>
    <p class="sub">Share your feedback or testimony, request counselling or consultation with Joseph Kisekka Ministries, or send us a prayer request. Our team will respond as soon as possible.</p>
    <form class="form" id="fbform">
      <div class="row"><label style="flex:1;min-width:220px">Full name<input name="name" required></label><label style="flex:1;min-width:220px">Phone or email<input name="contact" required></label></div>
      <label>Type of message<select name="type"><option>Feedback</option><option>Testimony</option><option>Consultation / Counselling request</option><option>Prayer request</option></select></label>
      <label>Your message<textarea name="msg" required></textarea></label>
      <div class="row"><button class="btn dark" type="submit">Send by Email</button><button class="btn" type="button" id="fbwa">Send by WhatsApp</button></div>
    </form>
  </div>
</section>


</main>
<div id="site-footer"></div>
<script src="data/content.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
